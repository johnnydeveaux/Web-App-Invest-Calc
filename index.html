<style>

    --grey: #6b6e75;
    --gold: #f4c247;
    --green: #4caf61;
    --teal: #2fbfae;
    --purple: #a374f5;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; background: var(--bg); color: var(--text); }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans", Ubuntu, sans-serif;

  .wrap { max-width: 640px; margin: 0 auto; }
  header { display: flex; align-items: center; gap: 8px; margin: 4px 4px 14px; }
  header .ver { flex: 1; }
  .flag { background: none; border: 0; padding: 4px; cursor: pointer; line-height: 0; border-radius: 8px; }
  .flag svg { width: 40px; height: 28px; border-radius: 5px; display: block; box-shadow: 0 0 0 1px rgba(255,255,255,.12); }
  .flag:active { transform: scale(.94); }
  .flag:focus-visible { outline: 2px solid var(--blue); }
  header h1 { font-size: 17px; font-weight: 600; margin: 0; }
  header .ver { font-size: 13px; color: var(--faint); }
  .card { background: var(--card); border-radius: 26px; overflow: hidden; }
  .result { padding: 22px 24px 20px; }
  .result .k { color: var(--muted); font-size: 15px; font-weight: 500; }
  .result .big { font-size: 34px; font-weight: 600; margin: 6px 0 8px; letter-spacing: -0.5px; font-variant-numeric: tabular-nums; }
  .result .sub { color: var(--muted); font-size: 15px; line-height: 1.4; }
  .result .split { color: var(--faint); font-size: 13px; margin-top: 8px; font-variant-numeric: tabular-nums; }
  hr { border: 0; border-top: 1px solid var(--line); margin: 0; }
  .chartbox { padding: 18px 18px 14px; }

  .dot { width: 11px; height: 11px; border-radius: 50%; display: inline-block; }
  .dash { width: 16px; border-top: 2px dashed var(--gold); display: inline-block; }

  #chart text { font-size: 15px; fill: var(--faint); font-variant-numeric: tabular-nums; }
  .controls { padding: 10px 24px 22px; }
  .row { padding: 14px 0 6px; }
  .gloss { margin: 28px 6px 8px; }
  .gloss h2 { font-size: 13px; font-weight: 600; color: var(--muted); margin: 0 0 8px; }
  .gloss table { width: 100%; border-collapse: collapse; font-size: 12px; color: var(--faint); line-height: 1.45; }
  .gloss td { padding: 8px 0; border-top: 1px solid var(--line); vertical-align: top; }
  .gloss td:first-child { width: 64px; color: var(--muted); font-weight: 600; padding-right: 10px; }
  .gloss b { color: var(--muted); font-weight: 500; }
  .income { padding: 20px 24px 22px; }

  .inc-sub { font-size: 13px; color: var(--faint); }
  .inc-big { margin: 10px 0 12px; font-size: 30px; font-weight: 600; color: var(--green); font-variant-numeric: tabular-nums; letter-spacing: -0.3px; }
  .inc-per { font-size: 16px; font-weight: 500; color: var(--muted); margin-left: 6px; }
  .inc-big.neg { font-size: 17px; font-weight: 500; color: var(--muted); letter-spacing: 0; }
  .inc-slider { margin-top: 4px; }
  .inc-sl-head { display: flex; justify-content: space-between; gap: 12px; font-size: 14px; color: var(--muted); margin-bottom: 4px; }
  #incMarginVal { color: var(--text); font-weight: 600; font-variant-numeric: tabular-nums; white-space: nowrap; }
  #incRange { width: 100%; }
  .inc-rows { margin-top: 12px; font-size: 14px; color: var(--muted); font-variant-numeric: tabular-nums; }
  .inc-rows div { display: flex; justify-content: space-between; gap: 12px; padding: 3px 0; }
  .inc-rows div span:last-child { color: var(--text); white-space: nowrap; }
  .income .hint { margin-top: 8px; line-height: 1.45; }
  .taxrow { padding: 0 24px 24px; margin-top: -8px; }
  .taxrow .lbl { font-size: 16px; font-weight: 500; margin-bottom: 10px; }
  .seg { display: flex; background: var(--bg); border-radius: 12px; padding: 3px; gap: 3px; }
  .seg button { flex: 1; background: none; border: 0; color: var(--muted); font: inherit; font-size: 14px; padding: 9px 4px; border-radius: 9px; cursor: pointer; line-height: 1.2; }
  .seg button small { display: block; font-size: 11px; color: var(--faint); margin-top: 2px; }
  .seg button[aria-checked=true] { background: var(--track); color: var(--text); font-weight: 600; }

  .row label { display: block; font-size: 16px; font-weight: 500; margin-bottom: 10px; }
  .line { display: flex; align-items: center; gap: 14px; }
  .line input[type=range] { flex: 1; }
  .val {
    width: 150px; text-align: right; font-size: 18px; font-weight: 600; color: var(--text);
    background: transparent; border: 1px solid transparent; border-radius: 8px; padding: 4px 6px;
    font-family: inherit; font-variant-numeric: tabular-nums;
  }
  .val:focus { outline: none; border-color: var(--blue); background: #1f2229; }
  input[type=range] { -webkit-appearance: none; appearance: none; height: 28px; background: transparent; margin: 0; }
  input[type=range]::-webkit-slider-runnable-track {
    height: 6px; border-radius: 3px;
    background: linear-gradient(var(--blue), var(--blue)) 0 / var(--p, 50%) 100% no-repeat, var(--track);
  }
  input[type=range]::-moz-range-track { height: 6px; border-radius: 3px; background: var(--track); }
  input[type=range]::-moz-range-progress { height: 6px; border-radius: 3px; background: var(--blue); }
  input[type=range]::-webkit-slider-thumb {
    -webkit-appearance: none; width: 24px; height: 24px; border-radius: 50%; background: var(--blue);
    margin-top: -9px; border: 0;
  }
  input[type=range]::-moz-range-thumb { width: 24px; height: 24px; border-radius: 50%; background: var(--blue); border: 0; }
  input[type=range]:focus-visible::-webkit-slider-thumb { box-shadow: 0 0 0 4px rgba(74,114,240,.35); }
  .foot { display: flex; justify-content: space-between; align-items: center; margin: 14px 6px 0; font-size: 13px; color: var(--faint); }
  .copom { margin: 18px 6px 0; font-size: 12px; color: var(--faint); line-height: 1.6; font-variant-numeric: tabular-nums; }
  .copom .r { display: flex; gap: 12px; }
  .copom .d { min-width: 110px; }
  .copom .chg { margin-left: auto; }
  .copom .up { color: #d98a7a; } .copom .down { color: #7fbf8f; }
  .copom .bar { display: flex; flex-wrap: wrap; gap: 6px 14px; align-items: center; margin-top: 8px; }
  .copom .link { background: none; border: 0; padding: 4px 0; font: inherit; color: var(--muted); cursor: pointer; text-decoration: underline; text-underline-offset: 3px; }
  .copom .link:disabled { opacity: .5; }
  .copom .link:focus-visible, .copom .chip:focus-visible { outline: 2px solid var(--blue); border-radius: 4px; }
  .copom .status { width: 100%; font-size: 11px; }
  .hist { margin-top: 10px; }
  .hist[hidden] { display: none; }
  .chips { display: flex; gap: 6px; margin: 0 -6px 8px; padding: 2px 6px; overflow-x: auto; scrollbar-width: none; -webkit-overflow-scrolling: touch; scroll-snap-type: x proximity; }
  .chips::-webkit-scrollbar { display: none; }
  .chip { flex: none; scroll-snap-align: start; }
  .chip { background: none; border: 1px solid var(--line); color: var(--faint); border-radius: 12px; padding: 2px 10px; font: inherit; cursor: pointer; }
  .chip[aria-pressed=true] { border-color: var(--muted); color: var(--text); }
  #copomChart { width: 100%; height: auto; display: block; margin-bottom: 6px; }
  #copomChart text { font-size: 18px; fill: var(--faint); }
  .list { max-height: 190px; overflow-y: auto; border-top: 1px solid var(--line); padding-top: 6px; -webkit-overflow-scrolling: touch; }
  .list.more { -webkit-mask-image: linear-gradient(to bottom, #000 70%, transparent); mask-image: linear-gradient(to bottom, #000 70%, transparent); }
  .list .y { color: var(--muted); margin-top: 6px; }
  .foot button { background: none; border: 0; color: var(--muted); font: inherit; padding: 6px 4px; cursor: pointer; }
  .foot button:focus-visible { outline: 2px solid var(--blue); border-radius: 6px; }
</style>
</head>
<body>
<div class="wrap">
  <header><h1>Invest Calc</h1><span class="ver" id="ver"></span><button class="flag" id="lang" type="button"></button></header>

  <div class="card">
    <div class="result">
      <div class="k" data-t="timeTo"></div>
      <div class="big" id="years">–</div>
      <div class="sub" id="subtitle"></div>
      <div class="split" id="split"></div>
      <div class="split" id="selicLine" style="color:var(--teal)"></div>
    </div>
    <hr>
    <div class="chartbox">
      <div class="legend">
        <span><i class="dot" style="background:var(--purple)"></i><span id="totalLbl"></span></span>
        <span><i class="dot" style="background:var(--grey)"></i><span data-t="invested"></span></span>
        <span><i class="dot" style="background:var(--teal)"></i><span data-t="selicBal"></span></span>
        <span><i class="dash"></i><span data-t="targetLine"></span></span>
      </div>
      <svg id="chart" viewBox="0 0 600 300" aria-label="Growth chart"></svg>
    </div>
    <hr>
    <div class="income">
      <div class="inc-head">
        <div class="tlabel" data-t="incTitle"></div>
        <div class="inc-sub" id="incSub"></div>
      </div>
      <div class="inc-big"><span id="incAmt"></span><span class="inc-per" data-t="perMonth"></span></div>
      <div class="inc-slider">
        <div class="inc-sl-head"><span data-t="incMargin"></span><span id="incMarginVal"></span></div>
        <input type="range" id="incRange" min="0" max="5" step="0.1">
      </div>
      <div class="inc-rows">
        <div><span data-t="incNet"></span><span id="incNet"></span></div>
        <div><span id="incKeepLbl"></span><span id="incKeep"></span></div>
      </div>
      <div class="hint" id="incNote"></div>
    </div>
    <hr>
    <div class="controls" id="controls"></div>
    <div class="taxrow">
      <div class="lbl" data-t="taxTitle"></div>
      <div class="seg" id="taxSeg" role="radiogroup"></div>
      <div class="hint" id="taxHint"></div>
    </div>
  </div>

  <div class="foot">
    <span data-t="method"></span>
    <button id="reset" type="button" data-t="reset"></button>
  </div>
  <div class="copom">
    <div id="copomRecent"></div>
    <div class="bar">
      <button class="link" id="histToggle" type="button" aria-expanded="false" aria-controls="hist"></button>
      <button class="link" id="copomUpdate" type="button"></button>
      <span class="status" id="copomStatus"></span>
    </div>
    <div class="hist" id="hist" hidden>
      <div class="chips" id="chips"></div>
      <svg id="copomChart" viewBox="0 0 600 170" aria-hidden="true"></svg>
      <div class="list" id="copomList"></div>
    </div>
  </div>
  <section class="gloss" aria-labelledby="glossTitle">
    <h2 id="glossTitle" data-t="glossTitle"></h2>
    <table id="glossTable"></table>
  </section>
</div>

  ["2026-08-05", 14.00], ["2026-09-16", 13.75], ["2026-11-04", 13.75],

let copom = { list: COPOM_BUILTIN, updated: null, source: "builtin" };
try { const c = JSON.parse(localStorage.getItem("investcalc.copom")); if (c && c.list && c.list.length) copom = c; } catch (e) {}

const CDI_BUILTIN = { rate: 13.65, date: "2026-11-04" };
let cdiBase = CDI_BUILTIN;

try { const c = JSON.parse(localStorage.getItem("investcalc.cdi")); if (c && typeof c.rate === "number") cdiBase = c; } catch (e) {}
// "% of CDI" is applied to the daily CDI rate, then compounded over 252 business days (how Brazilian banks calculate it)
function effRate() {
  const daily = Math.pow(1 + cdiBase.rate / 100, 1 / 252) - 1;
  return (Math.pow(1 + daily * state.cdiPct / 100, 252) - 1) * 100;
}

// Simulation: monthly compounding, contribution at end of each month
// Brazilian income tax (IR) on gains, regressive by holding time: <=180d 22.5%, <=360d 20%, <=720d 17.5%, then 15%
const irRate = months => months < 6 ? 0.225 : months < 12 ? 0.20 : months < 24 ? 0.175 : 0.15;
// Value after m months. Each deposit is its own lot with its own holding time, so tax is computed per lot.
// gross(m) = P(1+i)^m + c * sum_{j<m} (1+i)^j ; tax(m) = P((1+i)^m-1)ir(m) + c * sum_{j<m} ((1+i)^j-1) ir(j)
function series(rate, months, taxed) {
  const i = rate / 100 / 12, P = state.principal, c = state.monthly;
  const out = []; let sumG = 0, sumT = 0, g = 1;
  for (let m = 0; m <= months; m++) {
    const grow = Math.pow(1 + i, m);
    const gross = P * grow + c * sumG;
    const tax = taxed ? P * (grow - 1) * irRate(m) + c * sumT : 0;
    out.push({ gross, tax, net: gross - tax });
    sumG += g; sumT += (g - 1) * irRate(m); g *= (1 + i);
  }
  return out;
}
const cdiTaxed = () => state.tax === "cdb";
const selicTaxed = () => state.tax !== "none";
function simulate(months) {
  const a = series(effRate(), months, cdiTaxed()), b = series(state.selic, months, selicTaxed());
  return a.map((x, m) => ({ m, bal: x.net, gross: x.gross, tax: x.tax, sel: b[m].net, cap: state.principal + state.monthly * m }));
}
function monthsToTarget(rate = effRate(), taxed = cdiTaxed()) {
  if (state.principal >= state.target) return 0;
  const s = series(rate, 1200, taxed);
  for (let m = 1; m <= 1200; m++) if (s[m].net >= state.target) return m;
  return null; // not reached within 100 years
}

const svg = document.getElementById("chart");
const W = 600, H = 300, L = 72, R = 18, T = 14, B = 34;
let lastPts = [], lastMax = 1, lastSpan = 1;

function draw(hit, hitS) {
  const hits = [hit, hitS].filter(h => h !== null);
  const span = hits.length ? Math.max(12, Math.round((Math.max(...hits) || 1) * 1.7)) : 360;
  const pts = simulate(span);
  const last = pts[pts.length - 1];
  const maxY = Math.max(state.target, last.bal, last.sel) || 1;
  lastPts = pts; lastMax = maxY; lastSpan = span;
  const x = m => L + (m / span) * (W - L - R);
  const y = v => T + (1 - v / maxY) * (H - T - B);

  let s = "";
  for (let k = 0; k <= 4; k++) {
    const v = maxY * k / 4, yy = y(v);
    s += `<line x1="${L}" x2="${W - R}" y1="${yy}" y2="${yy}" stroke="#30333b" stroke-width="1"/>`;
    s += `<text x="${L - 8}" y="${yy + 4}" text-anchor="end">${k === 0 ? "$0" : kfmt(v)}</text>`;
  }
  for (let k = 0; k <= 5; k++) {
    const m = span * k / 5;
    s += `<text x="${k === 5 ? W - R : x(m)}" y="${H - 10}" text-anchor="${k === 5 ? "end" : "middle"}">${dec(m / 12)} ${t().axis}</text>`;
  }
  const path = key => pts.map((p, n) => (n ? "L" : "M") + x(p.m).toFixed(1) + "," + y(p[key]).toFixed(1)).join("");
  s += `<line x1="${L}" x2="${W - R}" y1="${y(state.target)}" y2="${y(state.target)}" stroke="var(--gold)" stroke-width="2" stroke-dasharray="7 6"/>`;
  s += `<path d="${path("cap")}" fill="none" stroke="var(--grey)" stroke-width="2.5"/>`;
  s += `<path d="${path("sel")}" fill="none" stroke="var(--teal)" stroke-width="2.5" stroke-linecap="round"/>`;
  s += `<path d="${path("bal")}" fill="none" stroke="var(--purple)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>`;
  if (hitS !== null) s += `<circle cx="${x(hitS)}" cy="${y(state.target)}" r="5" fill="var(--teal)"/>`;
  if (hit !== null) s += `<circle cx="${x(hit)}" cy="${y(state.target)}" r="7" fill="var(--green)"/>`;
  s += `<g id="hover" style="display:none"><line id="hl" y1="${T}" y2="${H - B}" stroke="#8a8f99" stroke-width="1"/><circle id="hc" r="5" fill="var(--purple)" stroke="#fff" stroke-width="2"/><rect id="hr" rx="8" height="56" fill="#1b1d22" stroke="#3a3d45"/><text id="ht1" style="fill:var(--purple);font-size:13px;font-weight:600"></text><text id="ht2" style="fill:#8b8f97;font-size:12px"></text><text id="ht3" style="font-size:12px;fill:var(--teal)"></text></g>`;
  svg.innerHTML = s;
}

// Touch / mouse readout on chart
function showAt(clientX) {
  const rect = svg.getBoundingClientRect();
  const sx = (clientX - rect.left) / rect.width * W;
  const m = Math.round(Math.min(Math.max((sx - L) / (W - L - R), 0), 1) * lastSpan);
  const p = lastPts[m]; if (!p) return;
  const x = L + (m / lastSpan) * (W - L - R);
  const y = T + (1 - p.bal / lastMax) * (H - T - B);
  const g = svg.querySelector("#hover"); g.style.display = "";
  svg.querySelector("#hl").setAttribute("x1", x); svg.querySelector("#hl").setAttribute("x2", x);
  const c = svg.querySelector("#hc"); c.setAttribute("cx", x); c.setAttribute("cy", y);
  // Fill the text first, then size and place the box around it
  const t1 = svg.querySelector("#ht1"), t2 = svg.querySelector("#ht2"), t3 = svg.querySelector("#ht3");
  t1.textContent = usd(p.bal);
  t2.textContent = t().tip(m ? fdur(m) : "0", usd(p.cap));
  t3.textContent = t().tipSelic(usd(p.sel));
  const bw = Math.ceil(Math.max(t1.getComputedTextLength(), t2.getComputedTextLength(), t3.getComputedTextLength())) + 20;
  let bx = x + bw + 12 > W ? x - bw - 10 : x + 10;
  bx = Math.max(2, Math.min(bx, W - bw - 2));
  const rr = svg.querySelector("#hr"); rr.setAttribute("x", bx); rr.setAttribute("y", T); rr.setAttribute("width", bw);
  t1.setAttribute("x", bx + 10); t1.setAttribute("y", T + 17);
  t2.setAttribute("x", bx + 10); t2.setAttribute("y", T + 33);
  t3.setAttribute("x", bx + 10); t3.setAttribute("y", T + 49);
}
const hide = () => { const g = svg.querySelector("#hover"); if (g) g.style.display = "none"; };
svg.addEventListener("pointermove", e => showAt(e.clientX));

svg.addEventListener("pointerleave", hide);

const fdate = iso => new Date(iso + "T12:00:00Z").toLocaleDateString(t().locale, { day: "numeric", month: "short", year: "numeric", timeZone: "UTC" });
const frate = r => r.toLocaleString(t().locale, { minimumFractionDigits: 2, maximumFractionDigits: 2 }) + "%";
function changeTag(list, n) {
  const prev = list[n + 1];
  if (!prev) return "";
  const d = Math.round((list[n].rate - prev.rate) * 100) / 100;
  if (d === 0) return `<span class="chg">${t().held}</span>`;
  const v = Math.abs(d).toLocaleString(t().locale, { minimumFractionDigits: 2 });
  return d > 0 ? `<span class="chg up">▲ ${v}</span>` : `<span class="chg down">▼ ${v}</span>`;
}
function renderCopom() {
  // The SELIC target regime started in March 1999. Older Banco Central records use a different (monthly) rate, so skip them.
  const desc = copom.list.filter(c => c.date >= "1999-03-01").sort((a, b) => b.date.localeCompare(a.date));
  document.getElementById("copomRecent").innerHTML = `<div>${t().copomTitle}</div>` + desc.slice(0, 3).map((c, n) =>
    `<div class="r"><span class="d">${fdate(c.date)}</span><span>${frate(c.rate)}${n === 0 ? " (" + t().current + ")" : ""}</span>${changeTag(desc, n)}</div>`).join("");

  const tg = document.getElementById("histToggle");
  tg.textContent = histOpen ? t().hideHist : t().showHist;
  tg.setAttribute("aria-expanded", histOpen);
  document.getElementById("hist").hidden = !histOpen;
  const ub = document.getElementById("copomUpdate");
  ub.textContent = copomBusy ? t().updating : t().update; ub.disabled = copomBusy;
  const today = new Date().toISOString().slice(0, 10);
  document.getElementById("copomStatus").textContent = copomError ? t().stError
    : copom.source === "builtin" ? t().stBuiltin(fdate(desc[0].date))
    : copom.noNew ? t().stNoNew(fdate(copom.updated)) : t().stUpdated(fdate(copom.updated));
  if (!copomError) document.getElementById("copomStatus").textContent += ". " + t().stCdi(pct(cdiBase.rate), fdate(cdiBase.date)) + ". " + t().stIpca(pct(ipcaBase.rate), new Date(ipcaBase.date + "T12:00:00Z").toLocaleDateString(t().locale, { month: "short", year: "numeric", timeZone: "UTC" }));
  if (!histOpen) return;

  // One chip per year of data available: 1 year, 2 years ... up to all of it
  const spanYears = Math.max(1, Math.ceil((Date.now() - Date.parse(desc[desc.length - 1].date)) / (365.25 * 864e5)));
  if (histRange > spanYears * 12) histRange = spanYears * 12;
  const chipsEl = document.getElementById("chips");
  const keepScroll = chipsEl.scrollLeft;
  chipsEl.innerHTML = Array.from({ length: spanYears }, (_, k) => k + 1).map(y =>
    `<button class="chip" type="button" data-r="${y * 12}" aria-pressed="${histRange === y * 12}">${t().yrs(y)}</button>`).join("");
  chipsEl.scrollLeft = keepScroll;
  const cutoff = new Date(Date.now() - histRange * 30.44 * 864e5).toISOString().slice(0, 10);
  const inRange = desc.filter(c => c.date >= cutoff);
  const asc = [...inRange].reverse();

  // Step chart
  const cw = 600, ch = 170, l = 70, r = 12, tp = 12, bt = 30;
  const t0 = Date.parse(asc[0].date), t1 = Date.parse(today) || Date.parse(asc[asc.length - 1].date);
  const rates = asc.map(c => c.rate);
  // Round axis to tidy steps (0.5, 1, 2.5, 5, 10...) with at most 4 gridlines
  const rawMin = Math.min(...rates), rawMax = Math.max(...rates);
  const ystep = [0.25, 0.5, 1, 2.5, 5, 10, 15].find(st => Math.ceil(rawMax / st) - Math.floor(rawMin / st) <= 3) || 15;
  let lo = Math.floor(rawMin / ystep) * ystep, hi = Math.ceil(rawMax / ystep) * ystep;
  if (hi === lo) hi = lo + ystep;
  const X = d => l + (Date.parse(d) - t0) / Math.max(1, t1 - t0) * (cw - l - r);
  const Y = v => tp + (1 - (v - lo) / (hi - lo)) * (ch - tp - bt);
  let g = "";
  const yticks = []; for (let v = lo; v <= hi + 1e-9; v += ystep) yticks.push(v);
  yticks.forEach(v => {
    g += `<line x1="${l}" x2="${cw - r}" y1="${Y(v)}" y2="${Y(v)}" stroke="#30333b"/>`;
    g += `<text x="${l - 8}" y="${Y(v) + 6}" text-anchor="end">${frate(v)}</text>`;
  });
  let d = "";
  asc.forEach((c, n) => { d += (n ? `H${X(c.date).toFixed(1)}V` : `M${X(c.date).toFixed(1)},`) + Y(c.rate).toFixed(1); });
  d += `H${cw - r}`;
  g += `<path d="${d}" fill="none" stroke="var(--teal)" stroke-width="${asc.length > 30 ? 2.5 : 3}" stroke-linejoin="round"/>`;
  // Dots only when there are few enough meetings to tell apart
  if (asc.length <= 30) asc.forEach(c => g += `<circle cx="${X(c.date)}" cy="${Y(c.rate)}" r="3.5" fill="var(--teal)"/>`);
  // Label every 1, 2, 5 or 10 years so labels never overlap (max about 6)
  const y0 = new Date(asc[0].date).getUTCFullYear(), y1 = new Date(today).getUTCFullYear();
  const xstep = [1, 2, 5, 10].find(st => (y1 - y0) / st <= 6) || 10;
  for (let y = y0 + 1; y <= y1; y++) {
    if (y % xstep) continue;
    const xx = X(y + "-01-01");
    g += `<line x1="${xx}" x2="${xx}" y1="${tp}" y2="${ch - bt}" stroke="#30333b" stroke-dasharray="3 4"/><text x="${xx}" y="${ch - 6}" text-anchor="middle">${y}</text>`;
  }
  document.getElementById("copomChart").innerHTML = g;

  // List grouped by year
  let html = "", yr = "";
  inRange.forEach(c => {
    const y = c.date.slice(0, 4);
    if (y !== yr) { html += `<div class="y">${y}</div>`; yr = y; }
    html += `<div class="r"><span class="d">${fdate(c.date)}</span><span>${frate(c.rate)}</span>${changeTag(desc, desc.indexOf(c))}</div>`;
  });
  const listEl = document.getElementById("copomList");
  listEl.innerHTML = html;
  listEl.scrollTop = 0;
  updateFade();
}

// Manual update from Banco Central
async function fetchCopomHistory() {
  // 1) Copom decision history (includes meetings where the rate was held)
  try {
    const r = await fetch("https://www.bcb.gov.br/api/servico/sitebcb/historicotaxasjuros", { cache: "no-store" });
    const j = await r.json();
    const rows = (j.conteudo || j.value || j).map(x => {
      const dateRaw = x.DataReuniaoCopom || x.dataReuniaoCopom || x.DataReuniao || x.dataReuniao;
      const rate = parseFloat(String(x.MetaSelic ?? x.metaSelic ?? x.TaxaSelic ?? "").replace(",", "."));
      return { date: String(dateRaw || "").slice(0, 10), rate };
    }).filter(x => /^\d{4}-\d{2}-\d{2}$/.test(x.date) && !isNaN(x.rate));
    if (rows.length > 5) return rows;
  } catch (e) {}
  // 2) Daily SELIC target series (SGS 432): only shows changes, so merge new ones into what we have
  const end = new Date(), start = new Date(Date.now() - 4 * 365 * 864e5);
  const br = d => d.toLocaleDateString("pt-BR", { timeZone: "UTC" });
  const r = await fetch(`https://api.bcb.gov.br/dados/serie/bcdata.sgs.432/dados?formato=json&dataInicial=${br(start)}&dataFinal=${br(end)}`, { cache: "no-store" });
  const j = await r.json();
  const last = [...copom.list].sort((a, b) => b.date.localeCompare(a.date))[0];
  const merged = [...copom.list];
  let prev = null;
  j.forEach(x => {
    const [dd, mm, yy] = x.data.split("/"); const date = `${yy}-${mm}-${dd}`; const rate = parseFloat(x.valor);
    if (prev !== null && rate !== prev && date > last.date) merged.push({ date, rate });
    prev = rate;
  });
  return merged;
}
document.getElementById("copomUpdate").addEventListener("click", async () => {
  copomBusy = true; copomError = false; renderCopom();
  let gotSomething = false;
  try {
    const end = new Date(), start = new Date(Date.now() - 20 * 864e5);
    const br = d => d.toLocaleDateString("pt-BR", { timeZone: "UTC" });
    const r = await fetch(`https://api.bcb.gov.br/dados/serie/bcdata.sgs.4389/dados?formato=json&dataInicial=${br(start)}&dataFinal=${br(end)}`, { cache: "no-store" });
    const j = await r.json(); const last = j[j.length - 1];
    const [dd, mm, yy] = last.data.split("/");
    const rate = parseFloat(String(last.valor).replace(",", "."));
    if (!isNaN(rate)) {
      cdiBase = { rate, date: `${yy}-${mm}-${dd}`, fetched: true };
      try { localStorage.setItem("investcalc.cdi", JSON.stringify(cdiBase)); } catch (e) {}
      gotSomething = true;
    }
  } catch (e) {}
  try {
    const end = new Date(), start = new Date(Date.now() - 120 * 864e5);
    const br = d => d.toLocaleDateString("pt-BR", { timeZone: "UTC" });
    const r = await fetch(`https://api.bcb.gov.br/dados/serie/bcdata.sgs.13522/dados?formato=json&dataInicial=${br(start)}&dataFinal=${br(end)}`, { cache: "no-store" });
    const j = await r.json(); const last = j[j.length - 1];
    const [dd, mm, yy] = last.data.split("/");
    const rate = parseFloat(String(last.valor).replace(",", "."));
    if (!isNaN(rate)) {
      ipcaBase = { rate, date: `${yy}-${mm}-${dd}` };
      try { localStorage.setItem("investcalc.ipca", JSON.stringify(ipcaBase)); } catch (e) {}
      gotSomething = true;
    }
  } catch (e) {}
  try {
    const list = await fetchCopomHistory();
    const latest = l => [...l].sort((a, b) => b.date.localeCompare(a.date))[0].date;
    const noNew = latest(list) === latest(copom.list);
    copom = { list, updated: new Date().toISOString().slice(0, 10), source: "bcb", noNew };
    try { localStorage.setItem("investcalc.copom", JSON.stringify(copom)); } catch (e) {}
  } catch (e) { copomError = !gotSomething; }
  copomBusy = false; renderCopom(); update();
});

// Months as "7 months" or "1 year 3 months"
const fdur = months => t().dur(Math.floor(months / 12), months % 12);

// Monthly amount you can take out while the balance still grows with inflation (+ optional margin)
function renderIncome() {
  const B = state.target;
  const iGross = Math.pow(1 + effRate() / 100, 1 / 12) - 1;
  const tax = state.tax === "cdb" ? 0.15 : 0;
  const net = B * iGross * (1 - tax);
  const keep = B * (Math.pow((1 + ipcaBase.rate / 100) * (1 + state.real / 100), 1 / 12) - 1);
  const can = Math.round(net) - Math.round(keep); // same rounding as the rows shown
  document.getElementById("incSub").textContent = t().incSub(usd(B));
  const rr = document.getElementById("incRange");
  if (document.activeElement !== rr) rr.value = state.real;
  rr.style.setProperty("--p", (state.real / 5 * 100) + "%");
  const rTxt = state.real.toLocaleString(t().locale, { maximumFractionDigits: 1 });
  document.getElementById("incMarginVal").textContent = t().incMarginVal(state.real ? rTxt : 0);
  const big = document.getElementById("incAmt").parentElement;
  big.classList.toggle("neg", can <= 0);
  document.getElementById("incAmt").textContent = can > 0 ? usd(can) : t().incNeg;
  big.querySelector(".inc-per").style.display = can > 0 ? "" : "none";
  document.getElementById("incNet").textContent = usd(net);
  document.getElementById("incKeepLbl").textContent = t().incKeep(pct(ipcaBase.rate), state.real ? rTxt : 0);
  document.getElementById("incKeep").textContent = "− " + usd(keep);
  document.getElementById("incNote").textContent = t().incNote[state.tax] + " " + t().incKeepMsg(state.real ? rTxt : 0);
}

function update() {
  FIELDS.forEach(f => {
    const r = document.getElementById("r-" + f.id);
    const v = document.getElementById("v-" + f.id);
    r.style.setProperty("--p", ((state[f.id] - r.min) / (r.max - r.min) * 100) + "%");
    if (document.activeElement !== v) v.value = fmt(f, state[f.id]);
  });
  document.getElementById("taxSeg").innerHTML = t().taxOpts.map(([v, l, sm]) =>
    `<button type="button" role="radio" data-v="${v}" aria-checked="${state.tax === v}">${l}<small>${sm}</small></button>`).join("");
  document.getElementById("taxHint").textContent = t().taxHint[state.tax];
  document.getElementById("totalLbl").textContent = t().total[state.tax](Math.round(state.cdiPct));
  renderIncome();
  const h = document.getElementById("cdiHint");
  if (h) h.textContent = t().cdiHint(pct(cdiBase.rate), fdate(cdiBase.date), pct(Math.round(effRate() * 100) / 100));
  const hit = monthsToTarget();
  const yearsEl = document.getElementById("years");
  const sub = document.getElementById("subtitle");
  const split = document.getElementById("split");
  if (hit === null) {
    yearsEl.textContent = t().never;
    sub.textContent = t().neverSub(usd(state.target));
    split.textContent = "";
  } else if (hit === 0) {
    yearsEl.textContent = t().already;
    sub.textContent = t().alreadySub(usd(state.target));
    split.textContent = "";
  } else {
    yearsEl.textContent = fdur(hit);
    sub.textContent = t().projected(usd(state.target));
    const p = simulate(hit)[hit];
    split.textContent = p.tax > 0 ? t().splitTax(usd(p.cap), usd(p.bal - p.cap), usd(p.tax), hit) : t().split(usd(p.cap), usd(p.bal - p.cap), hit);
  }
  const hitS = monthsToTarget(state.selic, selicTaxed());
  const sl = document.getElementById("selicLine");
  sl.textContent = hit === 0 ? "" : hitS === null ? t().selicNever : t().selicHit(fdur(hitS));
  draw(hit, hitS);
  try { localStorage.setItem(STORE, JSON.stringify(state)); } catch (e) {}
}
applyLang();
update();

if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => navigator.serviceWorker.register("sw.js").catch(() => {}));
}
